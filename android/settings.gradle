pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"

gradle.beforeProject { project ->
    if (project.name != "app" && project.name != "android" && project.projectDir.path.contains(".pub-cache")) {
        project.beforeEvaluate {
            project.pluginManager.withPlugin("com.android.library") {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlParser().parse(manifestFile)
                    def packageName = manifest.@package
                    if (packageName) {
                        project.android.namespace = packageName
                    }
                }
            }
        }
    }
}